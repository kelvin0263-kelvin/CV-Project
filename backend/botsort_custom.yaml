#
# Conservative BoT-SORT tuning for this project:
# - person-only tracking from a YOLO pose model
# - short occlusions around doors / partial fisheye overlap
# - stable IDs for counting without keeping stale tracks alive too long

tracker_type: botsort
track_high_thresh: 0.30
track_low_thresh: 0.10
new_track_thresh: 0.50
track_buffer: 80
match_thresh: 0.90
fuse_score: True

# Most counting cameras in this project are fixed-position. Disabling GMC saves
# CPU time; enable it again only if the camera itself moves or shakes.
gmc_method: none
proximity_thresh: 0.3
appearance_thresh: 0.7
with_reid: false
